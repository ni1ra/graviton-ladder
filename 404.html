<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | The graviton ladder</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/graviton-ladder/favicon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #fbfaf6;
  --surface: #f2efe6;
  --text: #1c1c1f;
  --muted: #54545b;
  --rule: #d6d1c3;
  --link: #0a54a6;
  --notice-bg: #fff4d6;
  --notice-edge: #8a5a00;
  --newer-bg: #e8f0fb;
  --newer-edge: #1f5aa8;
  --code-bg: #efece2;
  --focus: #b3470b;
  --serif: ui-serif, Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, Menlo, monospace;
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131417;
    --surface: #1d1e23;
    --text: #e9e9ec;
    --muted: #aeaeb6;
    --rule: #34353c;
    --link: #8cc2ff;
    --notice-bg: #2c2410;
    --notice-edge: #e0a73a;
    --newer-bg: #172233;
    --newer-edge: #6fa8ee;
    --code-bg: #1d1e23;
    --focus: #ffb27a;
  }
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-padding-top: 1rem; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 1.0625rem/1.65 var(--serif);
  overflow-wrap: break-word;
}

.wrap { max-width: 46rem; margin: 0 auto; padding: 0 1rem; }

a { color: var(--link); text-underline-offset: 0.15em; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 2px; }

.skip {
  position: absolute; left: 1rem; top: -4rem;
  background: var(--bg); color: var(--text); padding: 0.5rem 0.75rem;
  border: 2px solid var(--focus); z-index: 10;
}
.skip:focus { top: 0.5rem; }

h1, h2, h3, .kicker, .tag, nav, .buttons, caption, figcaption, footer, .meta {
  font-family: var(--sans);
}

header.top { padding: 2.25rem 0 0.5rem; }
.kicker { margin: 0 0 0.75rem; color: var(--muted); font-size: 0.875rem; letter-spacing: 0.02em; }
h1 { font-size: clamp(1.75rem, 5.2vw + 0.5rem, 2.75rem); line-height: 1.12; margin: 0 0 0.5rem; letter-spacing: -0.01em; }
.subtitle { font: 1.1875rem/1.4 var(--sans); color: var(--muted); margin: 0 0 1rem; }
.meta { font-size: 0.9rem; color: var(--muted); margin: 0 0 1.25rem; }
.lead { font-size: 1.1875rem; line-height: 1.6; margin: 0 0 1.25rem; }

.notice, .callout {
  border-left: 5px solid var(--notice-edge);
  background: var(--notice-bg);
  padding: 0.85rem 1rem;
  margin: 1.25rem 0;
  border-radius: 0 6px 6px 0;
}
.notice h2 { font-size: 1rem; margin: 0 0 0.25rem; }
.notice p { margin: 0; }
.callout.newer { border-left-color: var(--newer-edge); background: var(--newer-bg); }
.callout > h3 { margin-top: 0; font-size: 1.05rem; }
.callout > :last-child { margin-bottom: 0; }

.buttons { display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 1.25rem 0 0.5rem; padding: 0; list-style: none; }
.buttons a {
  display: inline-block; padding: 0.55rem 0.95rem; border: 2px solid var(--link);
  border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 0.95rem;
}
.buttons a.primary { background: var(--link); color: var(--bg); }
.buttons a:hover { text-decoration: underline; }

nav.toc { border-block: 1px solid var(--rule); margin: 1.5rem 0 0; padding: 0.6rem 0; font-size: 0.9rem; }
nav.toc ul { display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; margin: 0; padding: 0; list-style: none; }

main section { padding-top: 0.5rem; }
h2 { font-size: 1.5rem; line-height: 1.25; margin: 2.5rem 0 0.75rem; }
h3 { font-size: 1.1rem; line-height: 1.3; margin: 1.75rem 0 0.5rem; }
p, ul, ol { margin: 0 0 1rem; }
li { margin-bottom: 0.5rem; }
li > p { margin-bottom: 0.5rem; }

code, pre { font-family: var(--mono); font-size: 0.9em; }
code { background: var(--code-bg); padding: 0.05em 0.3em; border-radius: 3px; overflow-wrap: anywhere; }
pre {
  background: var(--code-bg); border: 1px solid var(--rule); border-radius: 6px;
  padding: 0.85rem 1rem; overflow-x: auto; margin: 0 0 1rem; line-height: 1.5; tab-size: 2;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
pre code { background: none; padding: 0; overflow-wrap: normal; }

figure.eq { margin: 0 0 1rem; padding: 0.5rem 0.75rem; background: var(--surface); border-radius: 6px; }
figure.eq figcaption { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.25rem; }
.math-scroll { overflow-x: auto; max-width: 100%; }
math {
  font-family: "Latin Modern Math", "STIX Two Math", "Cambria Math", "Noto Sans Math", "DejaVu Math TeX Gyre", math, serif;
  font-size: 1.15rem;
}
math[display="block"] { margin: 0.2rem 0; }

table { border-collapse: collapse; width: 100%; font-family: var(--sans); font-size: 0.95rem; }
caption { text-align: left; color: var(--muted); font-size: 0.875rem; padding-bottom: 0.5rem; caption-side: top; }
th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
thead th { border-bottom: 2px solid var(--text); font-weight: 650; }
tbody th { font-weight: 600; }
.table-wrap { margin: 0 0 1rem; }

ul.status { list-style: none; padding: 0; }
ul.status li { padding: 0.65rem 0; border-top: 1px solid var(--rule); margin: 0; }
ul.status li:last-child { border-bottom: 1px solid var(--rule); }
.tag {
  display: block; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
  margin-bottom: 0.15rem; color: var(--muted);
}
.tag.unreviewed, .tag.corrected, .tag.open { color: var(--notice-edge); }
.tag.proved { color: var(--link); }
.tag.newer { color: var(--newer-edge); }

footer { border-top: 1px solid var(--rule); margin-top: 3rem; padding: 1.25rem 0 3rem; font-size: 0.9rem; color: var(--muted); }
footer ul { display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; padding: 0; margin: 0 0 0.75rem; list-style: none; }
footer li { margin: 0; }

@media (max-width: 36rem) {
  body { font-size: 1rem; }
  table.cards thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  table.cards, table.cards tbody, table.cards tr, table.cards th, table.cards td { display: block; width: 100%; }
  table.cards caption { display: block; }
  table.cards tr { border: 1px solid var(--rule); border-radius: 6px; margin-bottom: 0.75rem; padding: 0.25rem 0; }
  table.cards th, table.cards td { border: 0; padding: 0.3rem 0.75rem; }
  table.cards td { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  table.cards td span { text-align: right; }
  table.cards td::before { content: attr(data-label); color: var(--muted); font-size: 0.85rem; flex: 0 0 45%; }
  table.cards tbody th { font-size: 1rem; }
  math { font-size: 1.05rem; }
}

@media print {
  body { background: #fff; color: #000; font-size: 11pt; }
  nav.toc, .buttons, .skip { display: none; }
  a { color: inherit; }
}
</style>
</head>
<body>
<main class="wrap" style="padding-top:3rem">
<h1>Page not found</h1>
<p>There is no page at this address. The graviton ladder has one page, and the paper is a PDF next to it.</p>
<ul class="buttons">
<li><a class="primary" href="/graviton-ladder/">Go to the graviton ladder</a></li>
<li><a href="/graviton-ladder/ladder_short.pdf">Paper (PDF)</a></li>
<li><a href="https://github.com/ni1ra/graviton-ladder">Repository</a></li>
</ul>
</main>
</body>
</html>
